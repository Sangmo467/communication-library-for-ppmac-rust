[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pmac-russh"
version = "2.0.7"
description = "Power PMAC communication through the pmac C ABI"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "sangmomo"}]
keywords = ["power-pmac", "gpascii", "ssh", "industrial-control"]

[project.urls]
Homepage = "https://gitee.com/sangmomo/communication-library-for-ppmac-rust"
Repository = "https://gitee.com/sangmomo/communication-library-for-ppmac-rust.git"

[tool.setuptools.packages.find]
where = ["."]
include = ["pmac*"]
