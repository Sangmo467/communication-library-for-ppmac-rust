name: Prebuilt SDK and GitHub Release
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish four tested SDK archives to GitHub Releases (select a version tag)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: prebuilt-sdk-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: SDK ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-pc-windows-msvc, os: windows-2022, python_arch: x64, managed: true }
          - { target: i686-pc-windows-msvc, os: windows-2022, python_arch: x86, managed: true }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, python_arch: x64, managed: true }
          - { target: i686-unknown-linux-gnu, os: ubuntu-22.04, python_arch: x64, managed: false }
    env:
      AWS_LC_SYS_PREBUILT_NASM: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.100.0'
          targets: ${{ matrix.target }}
      - if: matrix.target == 'i686-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib g++-multilib
      - if: matrix.managed
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: ${{ matrix.python_arch }}
      - if: matrix.managed
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install x86 .NET runtime
        if: matrix.target == 'i686-pc-windows-msvc'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build -Force | Out-Null
          Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile build/dotnet-install.ps1
          ./build/dotnet-install.ps1 -Runtime dotnet -Channel 8.0 -Architecture x86 -InstallDir build/dotnet-x86 -NoPath
      - name: Build, validate and package SDK
        shell: pwsh
        run: |
          $arguments = @{ Target='${{ matrix.target }}' }
          if ('${{ matrix.managed }}' -eq 'true') {
            $arguments.PythonExecutable = 'python'
            $arguments.DotnetExecutable = if ('${{ matrix.target }}' -eq 'i686-pc-windows-msvc') { (Join-Path $PWD 'build/dotnet-x86/dotnet.exe') } else { 'dotnet' }
          }
          ./scripts/Build-Release.ps1 @arguments
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error
          retention-days: 30
  publish:
    name: Publish GitHub Release attachments
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    # 使用 GitHub 自动提供的 Token，仅此发布 job 获得写权限。
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: sdk-*
          merge-multiple: true
          path: release-assets
      - name: Validate and upload four archives
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          ./scripts/Publish-GitHubRelease.ps1 -AssetDirectory release-assets -Tag $env:RELEASE_TAG -Commit $env:RELEASE_COMMIT
