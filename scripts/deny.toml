[graph]
targets = [
  "i686-pc-windows-msvc", "x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc",
  "i686-unknown-linux-gnu", "x86_64-unknown-linux-gnu",
  "armv7-unknown-linux-gnueabihf", "aarch64-unknown-linux-gnu",
]
all-features = true

[advisories]
db-path = "build/security-advisory-dbs"
yanked = "deny"

[licenses]
confidence-threshold = 0.93
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CC0-1.0", "0BSD", "Unlicense"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
